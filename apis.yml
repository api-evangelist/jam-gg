aid: jam-gg
name: Jam.gg
description: >-
  Jam.gg, founded in Paris in 2020 as Piepacker and rebranded in 2022, built a browser-based social
  cloud gaming platform for playing retro and indie multiplayer games with friends with no download or
  install, on patented streaming technology the company said cut bandwidth requirements by roughly 15x.
  It passed 8 million users before pivoting to selling its cloud gaming technology B2B to game
  developers and publishers. Backed by Makers Fund, Serena Capital, LEGO Ventures, Kima Ventures and
  Kickstarter (~$15.4M raised) and a Y Combinator W20 company. Jam.gg never published an HTTP API: its
  developer surface was a native game-integration SDK plus a Compose Multiplatform virtual gamepad
  library, both shipped from the GitHub organization still named piepacker. Y Combinator's company
  directory now lists Jam.gg as Inactive, noting the business split into two entities in 2023 with
  Onibi emerging separately; the jam.gg web property no longer completes a TLS handshake and
  piepacker.com has left DNS.
