  detail: >-
    Jam.gg never shipped an HTTP API, and the company is now listed Inactive by Y Combinator — its own
    web property cannot complete a TLS handshake on either host (jam.gg answers the ClientHello with
    TLS alert 80 internal_error from Netlify/AWS Global Accelerator, www.jam.gg answers with alert 40
    handshake_failure from the Webflow proxy), piepacker.com has left DNS, and no api/docs/developers
    subdomain resolves, so the only reachable artifacts are the first-party SDK repositories on GitHub.
